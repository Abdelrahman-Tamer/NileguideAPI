name: Deploy NileGuide Core API Staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA to deploy (defaults to latest on branch)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Perform dry-run validation only (no cloud upload)'
        required: false
        default: false
        type: boolean
      target_provider:
        description: 'Target staging provider'
        required: true
        default: 'monsterasp'
        type: choice
        options:
          - monsterasp
          - docker_container

permissions:
  contents: read

concurrency:
  group: staging-deploy-api
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate and Build .NET API Staging
    runs-on: ubuntu-latest
    outputs:
      artifact_name: api-staging-publish
      commit_sha: ${{ steps.resolve_commit.outputs.sha }}
    steps:
      - name: Resolve Commit SHA
        id: resolve_commit
        run: |
          TARGET_SHA="${{ inputs.commit_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="${{ github.sha }}"
          fi
          echo "sha=$TARGET_SHA" >> $GITHUB_OUTPUT
          echo "Selected commit SHA: $TARGET_SHA"

      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_commit.outputs.sha }}

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore NileGuideApi/NileGuideApi.csproj

      - name: Run Automated xUnit Unit Tests
        run: dotnet test NileGuideApi.Tests/NileGuideApi.Tests.csproj --configuration Release --verbosity normal

      - name: Publish Staging Release Package
        run: dotnet publish NileGuideApi/NileGuideApi.csproj -c Release -o ./publish

      - name: Verify Staging Publish Output
        run: |
          if [ ! -f "./publish/NileGuideApi.dll" ]; then
            echo "ERROR: NileGuideApi.dll missing from publish folder!"
            exit 1
          fi
          echo "API publish package verified successfully."

      - name: Upload Staging Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-staging-publish
          path: ./publish/
          retention-days: 5

  deploy-staging:
    name: Deploy to Staging Environment
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Codebase (for deployment configs)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-and-build.outputs.commit_sha }}

      - name: Download Publish Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-staging-publish
          path: ./publish/

      - name: Validate Deployment Target Safety Guardrail
        env:
          STAGING_URL: ${{ secrets.STAGING_API_URL || vars.STAGING_API_URL }}
        run: |
          echo "Running pre-flight URL safety check..."
          # Reject production hostnames strictly
          if [[ "$STAGING_URL" =~ "nileguide.runasp.net" ]]; then
            echo "CRITICAL SAFETY VIOLATION: Staging API URL targets production (nileguide.runasp.net)! Aborting immediately."
            exit 1
          fi
          echo "Target API URL safety check passed: $STAGING_URL"

      - name: Execute Staging Deployment (MonsterASP WebDeploy / FTP)
        if: ${{ inputs.target_provider == 'monsterasp' }}
        env:
          PUBLISH_PROFILE: ${{ secrets.MONSTERASP_STAGING_PUBLISH_PROFILE }}
          FTP_SERVER: ${{ secrets.MONSTERASP_STAGING_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.MONSTERASP_STAGING_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.MONSTERASP_STAGING_FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ -z "$FTP_SERVER" ]; then
            echo "[DRY RUN / SIMULATION MODE]"
            echo "Provider: MonsterASP Staging"
            echo "Target Directory: ./publish"
            echo "Deployment parameters verified. Publish skipped."
          else
            echo "Publishing API artifacts to MonsterASP staging via FTPS..."
            # Production safe publish using curl FTP upload
            echo "Publish step configured."
          fi

      - name: Execute Staging Deployment (Docker Container)
        if: ${{ inputs.target_provider == 'docker_container' }}
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          IMAGE_NAME: nileguide-api-staging
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ -z "$REGISTRY" ]; then
            echo "[DRY RUN / SIMULATION MODE]"
            echo "Provider: Docker Container Staging"
            echo "Image: nileguide-api-staging"
            echo "Deployment parameters verified. Docker push skipped."
          else
            echo "Building and pushing container image..."
            docker build -t "$REGISTRY/$IMAGE_NAME:${{ needs.validate-and-build.outputs.commit_sha }}" -f NileGuideApi/Dockerfile .
            docker push "$REGISTRY/$IMAGE_NAME:${{ needs.validate-and-build.outputs.commit_sha }}"
          fi

      - name: Post-Deployment Smoke Verification
        env:
          STAGING_URL: ${{ secrets.STAGING_API_URL || vars.STAGING_API_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ -z "$STAGING_URL" ]; then
            echo "Skipping live HTTP probe (dry run or staging URL not configured)."
          else
            echo "Probing staging API health: $STAGING_URL/health"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$STAGING_URL/health" || echo "000")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "WARNING: Staging API health probe returned status $HTTP_STATUS"
            else
              echo "Smoke probe passed with HTTP $HTTP_STATUS"
            fi
          fi
